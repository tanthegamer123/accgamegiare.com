```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box}

body{
    margin:0;

.card{

.btn{

}

.btn:hover{
    background:#6d28d9;

.btn.red{
    background:#dc2626;

.tabs{

.tabs button{
    flex:1;

}

    background:#7c3aed;
}

.hidden{

}

.notice{

    margin:10px 0;
}

.empty{
    text-align:center;
    padding:40px;
    color:#9ca3af;
}

.admin-title{
    color:#c4b5fd;
}

@media(max-width:650px){
    .container{
        padding:15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-full{
        grid-column:auto;
    }

    .balance{
        font-size:12px;
    }

    .logo{
        font-size:18px;
    }

        padding:22px;
    }

        font-size:12px;
    }
}
</style>
</head>

</header>


<!-- AUTH PAGE -->
<div id="authPage" class="container">

    <div class="auth box">

            <br><br>

            <input id="regPass2"
                   type="password"

            <br><br>

            <button class="btn"
                    style="width:100%"

</div>


<!-- ADMIN LOGIN -->
<div id="adminLoginPage" class="container hidden">

    <div class="auth box">

        <input id="adminPass"
               type="password"

        <button class="btn"

                   placeholder="🔎 Tìm acc..."

<script>
/* =========================
   DATABASE LOCALSTORAGE
========================= */

const ADMIN_USER = "admin";
const ADMIN_PASS = "TANSHOP@2026";

let currentUser =
    localStorage.getItem("tanCurrentUser") || "";

let currentGame = "all";

let accounts =
    JSON.parse(localStorage.getItem("tanShopAccounts") || "null");

if(!accounts){

    accounts = [

        {
            id:Date.now()+1,
            name:"Liên Quân Acc #001",
            game:"Liên Quân",
            username:"lq_demo_001",
            password:"demo123",
            price:50000,
            desc:"Acc Liên Quân demo"
        },

        {
            id:Date.now()+2,
            name:"Liên Quân Acc #002",
            game:"Liên Quân",
            username:"lq_demo_002",
            password:"demo456",
            price:100000,
            desc:"Acc Liên Quân VIP demo"
        },

        {
            id:Date.now()+3,
            name:"Roblox Acc #001",
            game:"Roblox",
            username:"rb_demo_001",
            password:"roblox123",
            price:50000,
            desc:"Acc Roblox demo"
        },

        {
            id:Date.now()+4,
            name:"Roblox Acc #002",
            game:"Roblox",
            username:"rb_demo_002",
            password:"roblox456",
            price:100000,
            desc:"Acc Roblox VIP demo"
        }

    ];

    saveAccounts();
}


/* =========================
   USERS
========================= */

function getUsers(){

    return JSON.parse(
        localStorage.getItem("tanUsers") || "{}"
    );

}

function saveUsers(users){

    localStorage.setItem(
        "tanUsers",
        JSON.stringify(users)
    );

}


/* =========================
   ACCOUNTS
========================= */

function saveAccounts(){

    localStorage.setItem(
        "tanShopAccounts",
        JSON.stringify(accounts)
    );

}


/* =========================
   LOGIN
========================= */

function showLogin(){

    document.getElementById("loginForm")
        .classList.remove("hidden");

    document.getElementById("registerForm")
        .classList.add("hidden");

    document.getElementById("loginTab")
        .classList.add("active");

    document.getElementById("registerTab")
        .classList.remove("active");

}

function showRegister(){

    document.getElementById("loginForm")
        .classList.add("hidden");

    document.getElementById("registerForm")
        .classList.remove("hidden");

    document.getElementById("loginTab")
        .classList.remove("active");

    document.getElementById("registerTab")
        .classList.add("active");

}


function registerUser(){

    const username =
        document.getElementById("regUser")
        .value.trim();

    const password =
        document.getElementById("regPass")
        .value;

    const password2 =
        document.getElementById("regPass2")
        .value;

    const error =
        document.getElementById("registerError");

    if(!username || !password){

        error.textContent =
            "Vui lòng nhập đầy đủ thông tin.";

        return;
    }

    if(password !== password2){

        error.textContent =
            "Mật khẩu nhập lại không đúng.";

        return;
    }

    if(username.toLowerCase() === ADMIN_USER){

        error.textContent =
            "Tên tài khoản này không được sử dụng.";

        return;
    }

    const users = getUsers();

    if(users[username]){

        error.textContent =
            "Tên đăng nhập đã tồn tại.";

        return;
    }

    users[username] = {
        password:password,
        balance:0,
        orders:[]
    };

    saveUsers(users);

    alert("Đăng ký thành công!");

    document.getElementById("loginUser").value =
        username;

    showLogin();

}


function loginUser(){

    const username =
        document.getElementById("loginUser")
        .value.trim();

    const password =
        document.getElementById("loginPass")
        .value;

    const users = getUsers();

    if(!users[username] ||
       users[username].password !== password){

        document.getElementById("loginError")
            .textContent =
            "Sai tài khoản hoặc mật khẩu.";

        return;
    }

    currentUser = username;

    localStorage.setItem(
        "tanCurrentUser",
        username
    );

    startShop();

}


/* =========================
   ADMIN LOGIN
========================= */

function showAdminLogin(){

    document.getElementById("authPage")
        .classList.add("hidden");

    document.getElementById("adminLoginPage")
        .classList.remove("hidden");

}

function backAuth(){

    document.getElementById("adminLoginPage")
        .classList.add("hidden");

    document.getElementById("authPage")
        .classList.remove("hidden");

}


function adminLogin(){

    const username =
        document.getElementById("adminUser")
        .value.trim();

    const password =
        document.getElementById("adminPass")
        .value;

    if(
        username !== ADMIN_USER ||
        password !== ADMIN_PASS
    ){

        document.getElementById("adminError")
            .textContent =
            "Sai tài khoản admin.";

        return;
    }

    localStorage.setItem(
        "tanAdminLogin",
        "true"
    );

    document.getElementById("adminLoginPage")
        .classList.add("hidden");

    document.getElementById("mainPage")
        .style.display = "block";

    document.getElementById("adminMenu")
        .classList.remove("hidden");

    document.getElementById("userMenu")
        .classList.add("hidden");

    document.getElementById("balanceBox")
        .textContent = "ADMIN";

    go("admin");

    renderAdmin();

}


/* =========================
   START
========================= */

function startShop(){

    document.getElementById("authPage")
        .classList.add("hidden");

    document.getElementById("adminLoginPage")
        .classList.add("hidden");

    document.getElementById("mainPage")
        .style.display = "block";

    document.getElementById("userMenu")
        .classList.remove("hidden");

    document.getElementById("adminMenu")
        .classList.add("hidden");

    updateBalance();

    renderProducts();

    renderOrders();

}


/* =========================
   NAVIGATION
========================= */

function go(page){

    document.querySelectorAll(".page")
        .forEach(p =>
            p.classList.remove("active")
        );

    const target =
        document.getElementById(page);

    if(target){
        target.classList.add("active");
    }

    closeMenu();

    if(page === "home")
        renderProducts();

    if(page === "orders")
        renderOrders();

    if(page === "admin")
        renderAdmin();

}


function filterGame(game){

    currentGame = game;

    go("home");

    renderProducts();

}


/* =========================
   PRODUCTS
========================= */

function renderProducts(){

    const box =
        document.getElementById("products");

    if(!box) return;

    const search =
        (document.getElementById("searchInput")
        ?.value || "")
        .toLowerCase();

    let list = accounts.filter(acc => {

        const gameOK =
            currentGame === "all" ||
            acc.game === currentGame;

        const searchOK =
            acc.name.toLowerCase()
                .includes(search) ||
            acc.game.toLowerCase()
                .includes(search);

        return gameOK && searchOK;

    });

    if(!list.length){

        box.innerHTML =
            `<div class="empty">
                Không tìm thấy tài khoản.
            </div>`;

        return;
    }

    box.innerHTML =
        list.map(acc => `

            <div class="card">

                <h3>${escapeHTML(acc.name)}</h3>

                <p>🎮 ${escapeHTML(acc.game)}</p>

                <p>${escapeHTML(acc.desc || "")}</p>

                <div class="price">
                    ${formatMoney(acc.price)}
                </div>

                <br>

                <button class="btn"
                        style="width:100%"
                        onclick="buyAccount(${acc.id})">
                    🛒 MUA NGAY
                </button>

            </div>

        `).join("");

}


/* =========================
   BUY
========================= */

function buyAccount(id){

    const acc =
        accounts.find(a => a.id === id);

    if(!acc) return;

    const users = getUsers();

    const user =
        users[currentUser];

    if(!user){

        alert("Vui lòng đăng nhập.");

        return;
    }

    if(user.balance < acc.price){

        alert(
            "Không đủ số dư!\n" +
            "Số dư hiện tại: " +
            formatMoney(user.balance)
        );

        return;
    }

    const ok =
        confirm(
            "Bạn có chắc muốn mua " +
            acc.name +
            " với giá " +
            formatMoney(acc.price) +
            "?"
        );

    if(!ok) return;

    user.balance -= acc.price;

    if(!user.orders)
        user.orders = [];

    user.orders.push({

        id:Date.now(),

        productId:acc.id,

        name:acc.name,

        game:acc.game,

        username:acc.username,

        password:acc.password,

        price:acc.price,

        time:new Date().toLocaleString("vi-VN")

    });

    delete accounts[
        accounts.findIndex(a => a.id === id)
    ];

    accounts =
        accounts.filter(Boolean);

    saveAccounts();
    saveUsers(users);

    alert(
        "🎉 Mua thành công!\n\n" +
        "Tài khoản: " +
        acc.username +
        "\nMật khẩu: " +
        acc.password
    );

    updateBalance();
    renderProducts();
    renderOrders();

}


/* =========================
   ORDERS
========================= */

function renderOrders(){

    const box =
        document.getElementById("ordersList");

    if(!box || !currentUser) return;

    const users = getUsers();

    const user =
        users[currentUser];

    if(!user || !user.orders || !user.orders.length){

        box.innerHTML =
            `<div class="empty">
                Bạn chưa mua tài khoản nào.
            </div>`;

        return;
    }

    box.innerHTML =
        user.orders
        .slice()
        .reverse()
        .map(order => `

            <div class="card"
                 style="margin-bottom:12px">

                <h3>
                    ${escapeHTML(order.name)}
                </h3>

                <p>
                    🎮 ${escapeHTML(order.game)}
                </p>

                <p>
                    💰 ${formatMoney(order.price)}
                </p>

                <p>
                    🕒 ${escapeHTML(order.time)}
                </p>

                <div class="notice">

                    <b>Tài khoản:</b>
                    ${escapeHTML(order.username)}

                    <br><br>

                    <b>Mật khẩu:</b>
                    ${escapeHTML(order.password)}

                </div>

            </div>

        `).join("");

}


/* =========================
   ADMIN
========================= */

function addAccount(){

    const name =
        document.getElementById("accName")
        .value.trim();

    const game =
        document.getElementById("accGame")
        .value;

    const username =
        document.getElementById("accUsername")
        .value.trim();

    const password =
        document.getElementById("accPassword")
        .value;

    const price =
        Number(
            document.getElementById("accPrice")
            .value
        );

    const desc =
        document.getElementById("accDesc")
        .value.trim();

    if(
        !name ||
        !username ||
        !password ||
        !price
    ){

        alert("Vui lòng nhập đầy đủ thông tin.");

        return;
    }

    accounts.push({

        id:Date.now(),

        name:name,

        game:game,

        username:username,

        password:password,

        price:price,

        desc:desc

    });

    saveAccounts();

    document.getElementById("accName").value="";
    document.getElementById("accUsername").value="";
    document.getElementById("accPassword").value="";
    document.getElementById("accPrice").value="";
    document.getElementById("accDesc").value="";

    renderAdmin();
    renderProducts();

    alert("Đã thêm tài khoản!");

}


function renderAdmin(){

    const box =
        document.getElementById("adminProducts");

    if(!box) return;

    document.getElementById("adminName")
        .textContent = ADMIN_USER;

    if(!accounts.length){

        box.innerHTML =
            `<div class="empty">
                Chưa có tài khoản.
            </div>`;

        return;
    }

    box.innerHTML =
        accounts.map(acc => `

            <div class="card"
                 style="margin-bottom:12px">

                <h3>
                    ${escapeHTML(acc.name)}
                </h3>

                <p>
                    🎮 ${escapeHTML(acc.game)}
                </p>

                <p>
                    👤 ${escapeHTML(acc.username)}
                </p>

                <p>
                    💰 ${formatMoney(acc.price)}
                </p>

                <p>
                    ${escapeHTML(acc.desc || "")}
                </p>

                <div class="actions">

                    <button class="btn"
                            onclick="editAccount(${acc.id})">
                        ✏️ Sửa
                    </button>

                    <button class="btn red"
                            onclick="deleteAccount(${acc.id})">
                        🗑️ Xóa
                    </button>

                </div>

            </div>

        `).join("");

}


function editAccount(id){

    const acc =
        accounts.find(a => a.id === id);

    if(!acc) return;

    const name =
        prompt("Tên acc:", acc.name);

    if(name === null) return;

    const game =
        prompt(
            "Game (Liên Quân hoặc Roblox):",
            acc.game
        );

    if(game === null) return;

    const username =
        prompt(
            "Tài khoản game:",
            acc.username
        );

    if(username === null) return;

    const password =
        prompt(
            "Mật khẩu game:",
            acc.password
        );

    if(password === null) return;

    const price =
        Number(
            prompt(
                "Giá:",
                acc.price
            )
        );

    if(!price) return;

    const desc =
        prompt(
            "Mô tả:",
            acc.desc || ""
        );

    acc.name = name;
    acc.game = game;
    acc.username = username;
    acc.password = password;
    acc.price = price;
    acc.desc = desc || "";

    saveAccounts();

    renderAdmin();
    renderProducts();

    alert("Đã cập nhật acc!");

}


function deleteAccount(id){

    const acc =
        accounts.find(a => a.id === id);

    if(!acc) return;

    if(!confirm(
        "Xóa " + acc.name + "?"
    )) return;

    accounts =
        accounts.filter(
            a => a.id !== id
        );

    saveAccounts();

    renderAdmin();
    renderProducts();

}


/* =========================
   BALANCE
========================= */

function updateBalance(){

    if(!currentUser) return;

    const users = getUsers();

    const user =
        users[currentUser];

    if(!user) return;

    document.getElementById("balanceBox")
        .textContent =
        formatMoney(user.balance);

}


/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem("tanCurrentUser");
    localStorage.removeItem("tanAdminLogin");

    currentUser = "";

    document.getElementById("mainPage")
        .style.display="none";

    document.getElementById("adminLoginPage")
        .classList.add("hidden");

    document.getElementById("authPage")
        .classList.remove("hidden");

    document.getElementById("userMenu")
        .classList.remove("hidden");

    document.getElementById("adminMenu")
        .classList.add("hidden");

    closeMenu();

}


/* =========================
   MENU
========================= */

function openMenu(){

    document.getElementById("side")
        .classList.add("open");

    document.getElementById("overlay")
        .classList.add("show");

}

function closeMenu(){

    document.getElementById("side")
        .classList.remove("open");

    document.getElementById("overlay")
        .classList.remove("show");

}


/* =========================
   FORMAT
========================= */

function formatMoney(number){

    return Number(number || 0)
        .toLocaleString("vi-VN") + "đ";

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   AUTO LOGIN
========================= */

if(
    localStorage.getItem("tanAdminLogin") === "true"
){

    document.getElementById("authPage")
        .classList.add("hidden");

    document.getElementById("mainPage")
        .style.display="block";

    document.getElementById("userMenu")
        .classList.add("hidden");

    document.getElementById("adminMenu")
        .classList.remove("hidden");

    document.getElementById("balanceBox")
        .textContent="ADMIN";

    go("admin");

}else if(currentUser){

    startShop();

}else{

    document.getElementById("mainPage")
        .style.display="none";

}

</script>
